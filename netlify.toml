[build]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client", "libsql"]

[dev]
  command = "cd client && npm run dev"
  targetPort = 5173
  port = 8888
  publish = "client/dist"
